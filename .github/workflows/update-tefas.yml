name: TEFAS Fiyat Güncelleme

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 16-20 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repository checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: TEFAS verilerini güncelle
        run: |
          python update-data.py

      - name: Git değişikliklerini kontrol et
        run: |
          git status
          git diff --stat

      - name: Güncel verileri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add portfolio.json
          git add tly-history.json
          git add thf-history.json

          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "TEFAS fiyatlarını güncelle"
            git push
          fi
