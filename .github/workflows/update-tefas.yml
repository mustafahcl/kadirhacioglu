name: TEFAS Fiyat Güncelleme

on:
  workflow_dispatch:

  schedule:
    # Türkiye saatiyle yaklaşık 19:00 - 23:00 arasında
    # 15 dakikada bir kontrol eder.
    #
    # GitHub Actions UTC kullanır.
    - cron: "0,15,30,45 16-20 * * 1-5"

permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # REPO'YU AL
      # ---------------------------------------------------

      - name: Repository checkout

        uses: actions/checkout@v4


      # ---------------------------------------------------
      # PYTHON
      # ---------------------------------------------------

      - name: Python 3.12 kurulumu

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ---------------------------------------------------
      # PYTEFAS
      # ---------------------------------------------------

      - name: TEFAS kütüphanesini kur

        run: |

          python -m pip install --upgrade pip

          python -m pip install --upgrade pytefas


      # ---------------------------------------------------
      # VERİLERİ ÇEK
      # ---------------------------------------------------

      - name: TEFAS verilerini güncelle

        run: |

          python update-data.py


      # ---------------------------------------------------
      # DEĞİŞİKLİKLERİ KONTROL ET
      # ---------------------------------------------------

      - name: Git değişikliklerini kontrol et

        run: |

          git status

          git diff --stat


      # ---------------------------------------------------
      # GITHUB'A GERİ YAZ
      # ---------------------------------------------------

      - name: Güncel verileri commit et

        run: |

          git config user.name "tefas-bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            portfolio.json \
            tly-history.json \
            thf-history.json


          if git diff --cached --quiet; then

            echo "Yeni veri yok."

          else

            git commit -m "TEFAS fiyatlarını güncelle"

            git push

          fi
